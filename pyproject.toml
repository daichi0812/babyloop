[project]
name = "babyloop"
version = "0.1.0"
description = "Looped transformers for multimodal BabyLM pretraining under a fixed word budget (LLMATCH)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=0.36.2",
    "hydra-core>=1.3",
    "numpy>=2.4.6",
    "scipy>=1.17.1",  # zero-shot eval(BLiMP等)の公式pipelineが import。plain `uv run` で評価が動くようメインに置く
    "tokenizers>=0.21.4",
    "torch==2.11.0",  # cu128(CUDA12.8) builds がこの版まで。linux/darwin で版を揃える（CUDA13既定を避ける）
    "transformers==4.51.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# full eval（GLUE finetune 等）専用の追加依存。zero-shot(BLiMP)には不要。
eval = [
    "nltk>=3.9.4",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "wandb>=0.18",  # 公式 finetune/trainer.py が無条件 import（実行時は --wandb 既定 off で未使用）。import を通すためだけに必要
]
# 視覚特徴の事前計算（scripts/precompute_vision.py, 前処理時のみ）専用。学習/評価env には不要。
# DINOv2 は transformers 経由で読むため追加依存は画像デコード(PIL)のみ。
vision = [
    "pillow>=11",
]
# 結果分析（scripts/analyze_paradigms.py）専用。collate出力の per-paradigm 分解と作図。
# 集計は stdlib(csv/json)・効果量CIは scipy(メイン依存)。作図の matplotlib のみ追加。
analysis = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babyloop"]

# CUDA: linux(A100) は CUDA 12.8 ビルドの torch を使う。PyPI 既定の torch は新しい
# CUDA(13系)向けで、A100サーバのドライバ(CUDA 12.x対応)では初期化に失敗するため。
# CUDA 12.8 ビルドは minor-version 互換で 12.x ドライバ上で動く。
# darwin(Mac開発機) は marker 非該当 → PyPI の CPU/MPS ビルドのまま。
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
